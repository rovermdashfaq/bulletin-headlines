<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Gallery – Bangladesh Scouts Rover Region</title><style>:root{--g:#0b6b3a;--g2:#e6f2ea;--bg:#fff;--fg:#14231a;--bd:#cfe0d5;color-scheme:light}[data-t=dark]{--g:#4cc17f;--g2:#16261d;--bg:#0e1712;--fg:#e8f3ec;--bd:#2a3d31;color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:16px/1.5 Georgia,serif;background:var(--bg);color:var(--fg)}header{background:var(--g);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}header h1{font-size:1.1rem;margin:0;flex:1}main{max-width:1000px;margin:auto;padding:16px}button,.btn{font:600 14px system-ui;background:var(--g);color:var(--bg);border:0;border-radius:8px;padding:8px 12px;cursor:pointer;text-decoration:none;display:inline-block}button.o{background:none;color:var(--g);border:1px solid var(--g)}header .btn,header button{background:#fff;color:var(--g)}button:disabled{opacity:.5}input,select{font:14px system-ui;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.card{border:1px solid var(--bd);border-radius:10px;overflow:hidden;font:12px system-ui}.card img{width:100%;height:120px;object-fit:contain;background:var(--g2);display:block;cursor:pointer}.card div{padding:6px 8px;word-break:break-all}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--g);color:var(--bg);padding:10px 16px;border-radius:8px;font:14px system-ui;display:none;z-index:9}</style></head><body>
<header><h1>Photo gallery – Bangladesh Scouts Rover Region</h1><a class="btn" href="ph.frame.html">Photo editor</a></header>
<main><div class="row"><input id="q" type="search" placeholder="Search filename"><select id="so"><option value="d">Newest first</option><option value="a">Oldest first</option><option value="n">Name A–Z</option></select><select id="wf"><option value="">All watermarks</option></select><input id="df" type="date" title="Uploaded on or after"></div>
<div id="info">Loading photos…</div><div class="grid" id="g"></div><div class="row"><button id="more" class="o" hidden>Load more</button></div></main>
<div id="lb" style="display:none;position:fixed;inset:0;background:#000e;z-index:8;padding:16px;text-align:center;overflow:auto"><img id="li" style="max-width:100%;max-height:70vh"><div class="row" style="justify-content:center"><button id="ld">Download</button><button id="lc">Copy image URL</button><button class="o" style="background:#fff" onclick="lb.style.display='none'">Close</button></div></div><div id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,collection,query,where,onSnapshot,doc,getDoc,updateDoc,deleteDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyArTcWEV4574JaDce_86yOcqu4REv83n1A",authDomain:"rover-bulletin-headlines.firebaseapp.com",projectId:"rover-bulletin-headlines",storageBucket:"rover-bulletin-headlines.firebasestorage.app",messagingSenderId:"784566961075",appId:"1:784566961075:web:21c27c0111450a53acc1c6"}),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let all=[],shown=12,admin=false,unsub=null,cur=null;
const toast=t=>{$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)};
const ts=p=>p.uploadedAt?.toMillis?p.uploadedAt.toMillis():0;
function sub(){if(unsub)unsub();const c=collection(db,'edited_photos');
 unsub=onSnapshot(admin?c:query(c,where('published','==',true)),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));
  const w=[...new Set(all.map(p=>p.watermarkName))],cv=$('wf').value;$('wf').innerHTML='<option value="">All watermarks</option>'+w.map(n=>'<option>'+n+'</option>').join('');$('wf').value=cv;render()},e=>{$('info').textContent='Could not load photos: '+e.message})}
onAuthStateChanged(auth,async u=>{admin=false;if(u){try{admin=(await getDoc(doc(db,'admins',u.uid))).exists()}catch{}}sub()});
function render(){let a=all.filter(p=>(p.editedFileName||'').toLowerCase().includes($('q').value.toLowerCase())&&(!$('wf').value||p.watermarkName==$('wf').value)&&(!$('df').value||ts(p)>=new Date($('df').value).getTime()));
 const s=$('so').value;a.sort((x,y)=>s=='n'?x.editedFileName.localeCompare(y.editedFileName):s=='a'?ts(x)-ts(y):ts(y)-ts(x));
 $('info').textContent=a.length?a.length+' photos'+(admin?' (admin view)':''):'No photos yet. Edit and publish some from the photo editor.';
 const g=$('g');g.innerHTML='';a.slice(0,shown).forEach(p=>{const c=document.createElement('div');c.className='card';
  c.innerHTML='<img loading="lazy" src="'+(p.thumbnailUrl||p.imageUrl)+'"><div>'+p.editedFileName+'<br>'+(ts(p)?new Date(ts(p)).toLocaleDateString():'')+'</div>';
  c.firstChild.onerror=e=>{e.target.alt='Image unavailable';e.target.removeAttribute('src')};c.firstChild.onclick=()=>{cur=p;$('li').src=p.imageUrl;$('lb').style.display='block'};
  if(admin){const d=c.lastChild;[[p.published?'Unpublish':'Publish',()=>updateDoc(doc(db,'edited_photos',p.id),{published:!p.published})],['Copy URL',()=>copy(p.imageUrl)],['Delete record',()=>confirm('Delete this record? The ImgBB image is kept.')&&deleteDoc(doc(db,'edited_photos',p.id))]].forEach(([t,f])=>{const b=document.createElement('button');b.className='o';b.textContent=t;b.onclick=f;d.append(b)})}
  g.append(c)});$('more').hidden=a.length<=shown}
const copy=u=>navigator.clipboard.writeText(u).then(()=>toast('URL copied'));
$('lc').onclick=()=>copy(cur.imageUrl);
$('ld').onclick=async()=>{try{const b=await (await fetch(cur.imageUrl)).blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cur.editedFileName;a.click()}catch{window.open(cur.imageUrl,'_blank')}};
$('more').onclick=()=>{shown+=12;render()};['q','so','wf','df'].forEach(i=>$(i).oninput=()=>{shown=12;render()});
</script></body></html>

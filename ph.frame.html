<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ফোটো ফ্রেম | রোভার অঞ্চল</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>:root{--g:#14352a;--g2:#1f4d3c;--sand:#efe7d2;--gold:#c8962e;--ink:#10201a;--red:#a4262c}
*{box-sizing:border-box}body{margin:0;font-family:'Hind Siliguri',sans-serif;background:var(--sand);color:var(--ink);line-height:1.5}
header{background:var(--g);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:4px solid var(--gold)}
header h1{font-size:1.1rem;margin:0;flex:1}header a{color:#f3d58a;text-decoration:none}
main{max-width:1000px;margin:0 auto;padding:16px}
.b{background:var(--g);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.b:hover{background:var(--g2)}.b.alt{background:var(--gold);color:#1a1405}.b.red{background:var(--red)}.b.sm{padding:5px 10px;font-size:.85rem}.b:disabled{opacity:.5}
.b:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:#fff;border:1px solid #cfc6ad;border-radius:10px;padding:14px;margin:14px 0}
.box h2{margin:0 0 10px;font-size:1.05rem}
input,select{font:inherit;padding:9px;border:1px solid #b9b095;border-radius:8px;width:100%;background:#fff}
label{display:block;font-size:.85rem;margin:8px 0 3px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:2px solid #d8cfb6;border-radius:10px;padding:8px;background:#fff;text-align:center;font-size:.85rem}
.card.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.card img,.card canvas{width:100%;display:block;border-radius:6px;background:#ddd linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:14px 14px}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal>div{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:380px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:10;max-width:90%}
.drop{border:2px dashed var(--g2);border-radius:10px;padding:22px;text-align:center;cursor:pointer;background:#f8f4e6}
.muted{color:#5b6a62;font-size:.85rem}.err{color:var(--red);font-size:.9rem}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.li>div{flex:1;min-width:0}
.li img{width:56px;height:56px;object-fit:contain;border-radius:6px;background:#ddd}

.card canvas{touch-action:none;cursor:grab}</style></head><body>
<header><h1>ফোটো ফ্রেম · পিআর মার্কেটিং ও আইসিটি টাস্কফোর্স</h1><span id="who"></span><button class="b alt sm" id="chg">নাম বদলান</button><a href="ph.prm.gallery.html">গ্যালারি</a></header>
<main>
<div class="box"><h2>১. ওয়াটারমার্ক বেছে নিন</h2><div class="grid" id="wms"><span class="muted">লোড হচ্ছে…</span></div></div>
<div class="box"><h2>২. ছবি আপলোড করুন</h2>
<div class="drop" id="drop">এখানে ছবি ফেলুন বা ট্যাপ করে বাছুন (একাধিক হতে পারে)</div>
<input type="file" id="fi" accept="image/*" multiple hidden></div>
<div class="box"><h2>৩. প্রিভিউ <span class="muted">(টেনে সরান, স্লাইডারে জুম)</span></h2><div class="grid" id="its" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))"><span class="muted">এখনো কোনো ছবি নেই</span></div>
<div class="row" style="margin-top:12px"><button class="b" id="dAll">সবগুলো ছবি ডাউনলোড</button><button class="b alt" id="dZip">ZIP হিসেবে ডাউনলোড</button></div>
<p class="muted" id="st"></p></div></main>
<div class="modal" id="nm"><div><h2 style="margin-top:0">আপনার নাম লিখুন</h2><input id="nmIn" placeholder="যেমন: রাকিব হাসান"><p style="text-align:right"><button class="b" id="nmSave">সেভ করুন</button></p></div></div>
<div id="toast"></div>
<script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import*as FS from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const{getFirestore,collection,doc,getDoc,getDocs,addDoc,setDoc,updateDoc,deleteDoc,query,where,orderBy,limit,startAfter,serverTimestamp}=FS;
const app=initializeApp({apiKey:"AIzaSyArTcWEV4574JaDce_86yOcqu4REv83n1A",authDomain:"rover-bulletin-headlines.firebaseapp.com",projectId:"rover-bulletin-headlines",storageBucket:"rover-bulletin-headlines.firebasestorage.app",messagingSenderId:"784566961075",appId:"1:784566961075:web:21c27c0111450a53acc1c6"});
const db=getFirestore(app);
// দ্রষ্টব্য: imgbb key ক্লায়েন্ট সাইডে থাকায় প্রকাশ্য; প্রয়োজনে key বদলে নিন।
const IMGBB="42e75a85c2fe0f2abd314632e59c2376";
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)};
async function up(blob,name='img.jpg'){const f=new FormData();f.append('key',IMGBB);f.append('image',blob,name);
 const r=await fetch('https://api.imgbb.com/1/upload',{method:'POST',body:f});const j=await r.json();
 if(!j.success)throw new Error(j.error?.message||'imgbb আপলোড ব্যর্থ');return j.data}
const loadImg=(src,cors)=>new Promise((ok,no)=>{const i=new Image();if(cors)i.crossOrigin='anonymous';i.onload=()=>ok(i);i.onerror=()=>no(new Error('ছবি লোড হয়নি'));i.src=src});
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

let uname=localStorage.getItem('phName'),wms=[],sel=null,wmImg=null,items=[];
const nameUI=()=>{$('#who').textContent=uname||''};nameUI();
const askName=()=>{$('#nmIn').value=uname||'';$('#nm').style.display='flex'};
if(!uname)askName();
$('#chg').onclick=askName;
$('#nmSave').onclick=()=>{const v=$('#nmIn').value.trim();if(!v)return;uname=v;localStorage.setItem('phName',v);$('#nm').style.display='none';nameUI()};
// ওয়াটারমার্ক লোড
(async()=>{try{const s=await getDocs(query(collection(db,'watermarks'),where('active','==',true)));
 wms=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.name.localeCompare(b.name));
 $('#wms').innerHTML=wms.length?'':'<span class="muted">কোনো ওয়াটারমার্ক নেই</span>';
 wms.forEach(w=>{const c=document.createElement('div');c.className='card';c.tabIndex=0;c.innerHTML=`<img src="${esc(w.displayUrl||w.url)}" alt=""><b>${esc(w.name)}</b><br><span class="muted">${w.widthPx}×${w.heightPx}px</span>`;
  c.onclick=async()=>{try{wmImg=await loadImg(w.url,true);sel=w;document.querySelectorAll('#wms .card').forEach(x=>x.classList.remove('on'));c.classList.add('on');items.forEach(draw)}catch(e){toast(e.message)}};
  $('#wms').appendChild(c)})}catch(e){$('#wms').textContent='লোড ব্যর্থ: '+e.message}})();
// ছবি যোগ
$('#drop').onclick=()=>$('#fi').click();
$('#drop').ondragover=e=>e.preventDefault();
$('#drop').ondrop=e=>{e.preventDefault();add(e.dataTransfer.files)};
$('#fi').onchange=e=>{add(e.target.files);e.target.value=''};
async function add(fl){for(const f of fl){if(!f.type.startsWith('image/'))continue;
 try{const img=await loadImg(URL.createObjectURL(f));const it={name:f.name.replace(/\.[^.]+$/,''),img,ox:.5,oy:.5,z:1,saved:false,wmId:null};
 const el=document.createElement('div');el.className='card';const c=document.createElement('canvas');c.width=400;c.height=300;
 const z=document.createElement('input');z.type='range';z.min=1;z.max=3;z.step=.01;z.value=1;z.setAttribute('aria-label','জুম');
 const r=document.createElement('button');r.className='b red sm';r.textContent='সরান';
 el.append(c,z,r);it.c=c;it.el=el;items.push(it);
 z.oninput=()=>{it.z=+z.value;draw(it)};
 r.onclick=()=>{items=items.filter(x=>x!==it);el.remove();if(!items.length)$('#its').innerHTML='<span class="muted">এখনো কোনো ছবি নেই</span>'};
 let p=null;c.onpointerdown=e=>{p=e;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>p=null;
 c.onpointermove=e=>{if(!p||!sel)return;const k=sel.widthPx/c.getBoundingClientRect().width,W=sel.widthPx,H=sel.heightPx;
  const s=Math.max(W/img.width,H/img.height)*it.z,ex=W-img.width*s,ey=H-img.height*s;
  if(ex<-1)it.ox=Math.min(1,Math.max(0,it.ox+(e.clientX-p.clientX)*k/ex));
  if(ey<-1)it.oy=Math.min(1,Math.max(0,it.oy+(e.clientY-p.clientY)*k/ey));p=e;draw(it)};
 if(!$('#its .card'))$('#its').innerHTML='';$('#its').appendChild(el);draw(it)}catch(e){toast(e.message)}}}
// ছবি বসানো: ওয়াটারমার্কের px অনুযায়ী cover-fit, তারপর ওভারলে
function draw(it){if(!sel||!wmImg)return;const W=sel.widthPx,H=sel.heightPx,c=it.c;c.width=W;c.height=H;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);
 const s=Math.max(W/it.img.width,H/it.img.height)*it.z,dw=it.img.width*s,dh=it.img.height*s;
 x.drawImage(it.img,(W-dw)*it.ox,(H-dh)*it.oy,dw,dh);x.drawImage(wmImg,0,0,W,H)}
const blobOf=it=>new Promise(ok=>{draw(it);it.c.toBlob(ok,'image/jpeg',.95)});
const fname=it=>`ph_${it.name}_${Date.now()}.jpg`;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function ready(){if(!sel){toast('আগে ওয়াটারমার্ক বাছুন');return false}if(!items.length){toast('আগে ছবি যোগ করুন');return false}if(!uname){askName();return false}return true}
async function toGallery(list){let n=0;for(const it of list){if(it.saved&&it.wmId===sel.id)continue;
 try{$('#st').textContent=`গ্যালারিতে সেভ হচ্ছে ${++n}/${list.length}…`;const d=await up(await blobOf(it),it.name+'.jpg');
 await addDoc(collection(db,'gallery'),{imageUrl:d.url,thumbUrl:d.thumb?.url||d.url,watermarkId:sel.id,watermarkName:sel.name,uploaderName:uname,createdAt:serverTimestamp()});
 it.saved=true;it.wmId=sel.id}catch(e){toast('গ্যালারি সেভ ব্যর্থ: '+e.message)}}
 $('#st').textContent='সম্পন্ন ✔'}
$('#dAll').onclick=async()=>{if(!ready())return;for(const it of items){dl(await blobOf(it),fname(it));await wait(500)}toGallery(items)};
$('#dZip').onclick=async()=>{if(!ready())return;const z=new JSZip();let i=0;
 for(const it of items)z.file(`${++i}_${fname(it)}`,await blobOf(it));
 dl(await z.generateAsync({type:'blob'}),`ph_photos_${Date.now()}.zip`);toGallery(items)};
</script></body></html>

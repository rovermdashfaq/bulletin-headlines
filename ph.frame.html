<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bangladesh Scouts Rover Region – Photo Editing Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--g:#0b6b3a;--g2:#e6f2ea;--bg:#fff;--fg:#14231a;--bd:#cfe0d5;color-scheme:light}
[data-t=dark]{--g:#4cc17f;--g2:#16261d;--bg:#0e1712;--fg:#e8f3ec;--bd:#2a3d31;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Georgia,serif;background:var(--bg);color:var(--fg)}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:1.1rem;margin:0}header small{display:block;opacity:.85;font-family:system-ui}header div{flex:1}
main{max-width:1000px;margin:auto;padding:16px}h2{font-size:1.1rem;margin:20px 0 8px}
button,.btn{font:600 14px system-ui;background:var(--g);color:var(--bg);border:0;border-radius:8px;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.o,.btn.o{background:none;color:var(--g);border:1px solid var(--g)}header button,header .btn{background:#fff;color:var(--g)}button:disabled{opacity:.5}
#drop{border:2px dashed var(--g);border-radius:12px;padding:28px;text-align:center;background:var(--g2)}#drop.on{background:var(--bd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:2px solid var(--bd);border-radius:10px;overflow:hidden;font:12px system-ui;cursor:pointer}.card.sel{border-color:var(--g)}
.card img{width:100%;height:110px;object-fit:contain;background:var(--g2);display:block}.card p{margin:0;padding:6px 8px;word-break:break-all}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}progress{width:100%}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--g);color:var(--bg);padding:10px 16px;border-radius:8px;font:14px system-ui;display:none;z-index:9}
.ba{display:none;position:fixed;inset:0;background:#000d;z-index:8;padding:16px;overflow:auto}.ba img{max-width:100%;max-height:45vh;display:block;margin:6px auto}
</style></head><body>
<header><div><h1>Bangladesh Scouts Rover Region – Photo Editing Studio</h1><small>PR, Marketing &amp; ICT Taskforce | Photo Editing Team</small></div>
<a class="btn" href="prm.ph.gallery.html">Photo gallery</a><button id="th">Dark mode</button></header>
<main>
<h2>1. Add photographs</h2>
<div id="drop"><p>Drag photos here, or</p><button onclick="fi.click()">Choose photos</button>
<input id="fi" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden></div>
<div class="row"><span id="cnt">0 photos</span><button class="o" id="all">Select all</button><button class="o" id="rs">Remove selected</button><button class="o" id="clr">Clear workspace</button></div>
<div class="grid" id="photos"></div>
<h2>2. Choose a watermark</h2><div class="grid" id="wms">Loading watermarks…</div>
<h2>3. Apply, publish and download</h2>
<div class="row"><button id="go">Apply watermark</button><button id="pub" disabled>Publish to gallery</button>
<button id="dl" disabled>Download all photos</button><button id="zip" disabled>Download all as ZIP</button></div>
<progress id="pr" value="0" max="1" hidden></progress><div id="msg"></div>
</main><div id="toast"></div>
<div class="ba" id="ba"><button onclick="ba.style.display='none'">Close</button><p style="color:#fff">Before</p><img id="b1"><p style="color:#fff">After</p><img id="b2"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getFirestore,collection,query,where,getDocs,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyArTcWEV4574JaDce_86yOcqu4REv83n1A",authDomain:"rover-bulletin-headlines.firebaseapp.com",projectId:"rover-bulletin-headlines",storageBucket:"rover-bulletin-headlines.firebasestorage.app",messagingSenderId:"784566961075",appId:"1:784566961075:web:21c27c0111450a53acc1c6"}));
const API='/api/upload',$=id=>document.getElementById(id);let items=[],wm=null,wmImg=null,busy=false;
const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)};
const sz=b=>b>1e6?(b/1e6).toFixed(1)+' MB':Math.round(b/1e3)+' KB';
$('th').onclick=()=>{const d=document.documentElement;d.dataset.t=d.dataset.t=='dark'?'':'dark'};
function add(list){for(const f of list){if(!/^image\/(jpeg|png|webp)$/.test(f.type)){toast(f.name+': unsupported format');continue}
 const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{items.push({f,url,w:im.naturalWidth,h:im.naturalHeight,st:'Ready',sel:false});draw()};im.src=url}}
fi.onchange=e=>{add(e.target.files);fi.value=''};
drop.ondragover=e=>{e.preventDefault();drop.classList.add('on')};drop.ondragleave=()=>drop.classList.remove('on');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('on');add(e.dataTransfer.files)};
function draw(){$('cnt').textContent=items.length+(items.length==1?' photo':' photos');const g=$('photos');g.innerHTML='';
 if(!items.length)g.innerHTML='<p>No photos yet. Add some to begin.</p>';
 items.forEach((it,i)=>{const c=document.createElement('div');c.className='card'+(it.sel?' sel':'');
  c.innerHTML=`<img src="${it.out?it.outUrl:it.url}"><p>${it.f.name}<br>${it.w}×${it.h} · ${sz(it.f.size)}<br><b>${it.st}</b></p>`;
  c.onclick=()=>{if(it.out){b1.src=it.url;b2.src=it.outUrl;ba.style.display='block'}else{it.sel=!it.sel;draw()}};
  const x=document.createElement('button');x.className='o';x.textContent='Remove';x.onclick=e=>{e.stopPropagation();rm(i)};c.append(x);g.append(c)});
 const done=items.length&&items.every(i=>i.out);$('dl').disabled=$('zip').disabled=!done;$('pub').disabled=!done||items.every(i=>i.pubd)}
function rm(i){URL.revokeObjectURL(items[i].url);if(items[i].outUrl)URL.revokeObjectURL(items[i].outUrl);items.splice(i,1);draw()}
$('all').onclick=()=>{const v=!items.every(i=>i.sel);items.forEach(i=>i.sel=v);draw()};
$('rs').onclick=()=>{items.filter(i=>i.sel).forEach(i=>rm(items.indexOf(i)))};
$('clr').onclick=()=>{if(items.length&&confirm('Remove all photos?')){while(items.length)rm(0)}};
async function loadWms(){try{const s=await getDocs(query(collection(db,'watermarks'),where('status','==','active')));const g=$('wms');g.innerHTML='';
 if(s.empty)g.textContent='No active watermarks yet. Ask an admin to add one.';
 s.forEach(d=>{const w={id:d.id,...d.data()},c=document.createElement('div');c.className='card';
  c.innerHTML=`<img src="${w.imageUrl}" crossorigin="anonymous"><p>${w.name}<br>${w.aspectRatio} · ${w.width}×${w.height}px</p>`;
  c.onclick=()=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{wm=w;wmImg=im;document.querySelectorAll('#wms .card').forEach(x=>x.classList.remove('sel'));c.classList.add('sel')};im.onerror=()=>toast('Could not load that watermark');im.src=w.imageUrl};g.append(c)})
 }catch(e){$('wms').textContent='Could not load watermarks: '+e.message}}
function render(it){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const W=im.naturalWidth,H=im.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0);
 const m=Math.round(Math.min(W,H)*.02);let w=wm.width,h=wm.height;const s=Math.min(1,(W-2*m)/w,(H-2*m)/h);w=Math.round(w*s);h=Math.round(h*s);
 const p=wm.position||'bottom-right',px=p.includes('left')?m:p.includes('right')?W-w-m:(W-w)/2,py=p.includes('top')?m:p.includes('bottom')?H-h-m:(H-h)/2;
 x.globalAlpha=(wm.opacity??100)/100;x.drawImage(wmImg,px,py,w,h);
 const png=it.f.type=='image/png';c.toBlob(b=>{c.width=c.height=0;b?ok(b):no(Error('encode failed'))},png?'image/png':'image/jpeg',.95)};im.onerror=()=>no(Error('decode failed'));im.src=it.url})}
const nm=it=>it.f.name.replace(/\.[^.]+$/,'')+'_watermarked.'+(it.f.type=='image/png'?'png':'jpg');
$('go').onclick=async()=>{if(busy)return;if(!items.length)return toast('Add photos first');if(!wm)return toast('Choose a watermark first');busy=true;pr.hidden=false;pr.max=items.length;pr.value=0;
 for(const it of items){it.st='Processing…';draw();try{if(it.outUrl)URL.revokeObjectURL(it.outUrl);it.out=await render(it);it.outUrl=URL.createObjectURL(it.out);it.st='Done';it.pubd=false}catch(e){it.out=null;it.st='Failed: '+e.message}pr.value++;draw()}
 busy=false;toast('Processing finished. Tap a photo for before/after.')};
const save=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
$('dl').onclick=async()=>{const l=items.filter(i=>i.out);pr.hidden=false;pr.max=l.length;pr.value=0;for(const i of l){save(i.out,nm(i));pr.value++;await new Promise(r=>setTimeout(r,400))}toast('Downloads started')};
$('zip').onclick=async()=>{const z=new JSZip();items.filter(i=>i.out).forEach(i=>z.file(nm(i),i.out));pr.hidden=false;pr.max=100;
 save(await z.generateAsync({type:'blob'},m=>pr.value=m.percent),'Bangladesh_Scouts_Rover_Region_Photos.zip');toast('ZIP ready')};
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(b)});
$('pub').onclick=async()=>{if(busy)return;busy=true;const l=items.filter(i=>i.out&&!i.pubd);pr.hidden=false;pr.max=l.length;pr.value=0;let ok=0;
 for(const it of l){it.st='Uploading…';draw();try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:await b64(it.out),name:nm(it)})});
  const j=await r.json();if(!r.ok)throw Error(j.error);
  await addDoc(collection(db,'edited_photos'),{photoId:crypto.randomUUID(),imageUrl:j.url,thumbnailUrl:j.thumb,originalFileName:it.f.name,editedFileName:nm(it),watermarkId:wm.id,watermarkName:wm.name,imageWidth:it.w,imageHeight:it.h,fileSize:it.out.size,uploadedAt:serverTimestamp(),published:true});
  it.pubd=true;it.st='Published';ok++}catch(e){it.st='Upload failed: '+e.message}pr.value++;draw()}
 busy=false;toast(ok+' of '+l.length+' published')};
draw();loadWms();
</script></body></html>
